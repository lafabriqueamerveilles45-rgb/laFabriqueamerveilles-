<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Fabrique à Merveilles</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  color: #4f3b43;
  background: white;
}

/* EN-TÊTE */
header {
  background: linear-gradient(135deg, #f9dce9, #fff7fb);
  text-align: center;
  padding: 70px 20px 50px;
}

header h1 {
  margin: 0;
  color: #c49a48;
  font-size: clamp(42px, 9vw, 80px);
  line-height: 1;
}

header p {
  font-size: 22px;
  font-style: italic;
  margin-top: 28px;
}

/* MENU */
nav {
  background: white;
  padding: 18px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #f0dce5;
}

nav a {
  color: #966f80;
  text-decoration: none;
  font-weight: bold;
  margin: 0 10px;
  display: inline-block;
  padding: 6px;
}

/* ACCUEIL */
.hero {
  background: #fbeaf1;
  text-align: center;
  padding: 80px 20px;
}

.hero h2 {
  color: #bd9144;
  font-size: clamp(36px, 8vw, 65px);
  margin-top: 0;
}

.hero p {
  max-width: 750px;
  margin: auto;
  font-size: 20px;
  line-height: 1.7;
}

.btn {
  display: inline-block;
  margin-top: 30px;
  padding: 15px 28px;
  border-radius: 40px;
  background: #c9a45a;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* SECTIONS */
section {
  padding: 70px 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.titre {
  text-align: center;
  color: #9d7181;
  font-size: 42px;
  margin-bottom: 40px;
}

/* CRÉATIONS */
.creations {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 25px;
}

.carte {
  background: white;
  border: 1px solid #f0dfe6;
  border-radius: 25px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(90,60,70,0.12);
}

.carte .emoji {
  font-size: 75px;
  margin-bottom: 15px;
}

.carte h3 {
  color: #896473;
  font-size: 23px;
}

.carte p {
  line-height: 1.6;
}

.prix {
  color: #bd9144;
  font-size: 22px;
  font-weight: bold;
  margin-top: 15px;
}

/* PERSONNALISATION */
.personnalisation {
  background: #fff7fa;
  text-align: center;
}

.person
